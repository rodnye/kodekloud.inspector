name: Publish output

on:
  workflow_dispatch:
    inputs:
      max_courses:
        description: 'Maximum number of courses to process (0 = no limit)'
        required: false
        default: '0'
        type: string
      parallel_batches:
        description: 'Number of parallel batches'
        required: false
        default: '7'
        type: string
      force_download:
        description: 'Force re-download even if markdown file already exists'
        required: false
        default: 'false'
        type: string

jobs:
  publish-md-output:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout output/markdown branch
        uses: actions/checkout@v4
        with:
          ref: output/markdown
          path: ./output
          fetch-depth: 0
        continue-on-error: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install
          pnpm exec playwright install
          echo "HEADLESS=true" >> .env
          echo "PARALLEL_BATCHES=${{ github.event.inputs.parallel_batches || '7' }}" >> .env
          echo "MAX_COURSES=${{ github.event.inputs.max_courses || '0' }}" >> .env
          echo "FORCE_DOWNLOAD=${{ github.event.inputs.force_download || 'false' }}" >> .env
          mkdir -p ./output/.github
          cp ./.github/secret_scanning.yml ./output/.github

      - name: Generate output
        run: pnpm scrape

      - name: Set current date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Publish output folder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output/markdown
          publish_dir: ./output
          commit_message: 'chore: update output - ${{ env.CURRENT_DATE }}'
